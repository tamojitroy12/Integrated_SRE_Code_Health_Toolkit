# Prometheus: pushed application metrics arrive by remote write; the Toolkit's own api and
# worker are scraped over the internal network with a bearer token (DEPLOYMENT.md §2.3, §6).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: toolkit-api
    authorization:
      type: Bearer
      credentials_file: /tmp/scrape_token
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: toolkit-worker
    authorization:
      type: Bearer
      credentials_file: /tmp/scrape_token
    static_configs: [{ targets: ["worker:9100"] }]

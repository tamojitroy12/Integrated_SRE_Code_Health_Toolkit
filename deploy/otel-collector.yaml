# OpenTelemetry Collector: authenticates OTLP senders and forwards metrics to Prometheus
# (DEPLOYMENT.md §2.2, TRD §3). Only metrics are accepted (CON-03).
extensions:
  bearertokenauth:
    scheme: Bearer
    token: ${env:OTLP_INGEST_TOKEN}
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth: { authenticator: bearertokenauth }
      http:
        endpoint: 0.0.0.0:4318
        auth: { authenticator: bearertokenauth }

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 2s

exporters:
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true  # service.name → service_name, deployment.environment.name → deployment_environment_name

service:
  extensions: [bearertokenauth, health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
